name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check formatting and linting
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Run tests
        run: python -m pytest -v

      - name: Build distribution
        run: python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-wheel
          path: dist/*.whl
          if-no-files-found: error

  container-smoke-test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and smoke-test the inference container
        shell: bash
        run: |
          docker build -t driftguard:${{ github.sha }} .
          docker run --detach --rm --publish 8000:8000 --name driftguard-smoke driftguard:${{ github.sha }}
          trap 'docker logs driftguard-smoke; docker stop driftguard-smoke || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
