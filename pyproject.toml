[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "monitoring*", "orchestration*", "serving*", "training*"]
exclude = ["tests*", "grafana*", "prometheus*", "load_testing*"]

[project]
name = "driftguard"
version = "1.0.0"
description = "Drift-Aware Fraud Detection with Autonomous Retraining"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DriftGuard Team" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.2,<1.8.0",
    "imbalanced-learn>=0.14.0,<0.15.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "mlflow>=2.10.0",
    "evidently>=0.4.15",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "locust>=2.20.0",
    "ruff>=0.2.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
